<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #007aff;
            margin-bottom: 30px;
        }
        h1 {
            color: #007aff;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }
        .product-image {
            height: 200px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        .product-info {
            padding: 20px;
        }
        .product-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #222;
        }
        .product-details {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }
        .product-price {
            font-size: 1.8rem;
            font-weight: bold;
            color: #007aff;
            margin-bottom: 20px;
        }
        .btn-buy {
            display: block;
            width: 100%;
            padding: 12px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn-buy:hover {
            background: #0056b3;
        }
        .loading, .error {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .error { color: #ff3b30; }
        footer {
            text-align: center;
            padding: 30px 0;
            color: #666;
            border-top: 1px solid #eee;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 iPhone Shop</h1>
            <p>Официальный интернет-магазин Apple iPhone</p>
        </header>

        <div id="products" class="products">
            <div class="loading">Загрузка товаров...</div>
        </div>

        <footer>
            <p>&copy; 2026 iPhone Shop. Все права защищены.</p>
        </footer>
    </div>

    <script>
        // Функция для загрузки товаров из backend API
        async function loadProducts() {
            const productsContainer = document.getElementById('products');
            productsContainer.innerHTML = '<div class="loading">Загрузка товаров...</div>';
            
            try {
                const response = await fetch('/api/iphones');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const products = await response.json();
                
                if (products.length === 0) {
                    productsContainer.innerHTML = '<div class="error">Товары не найдены</div>';
                    return;
                }
                
                productsContainer.innerHTML = '';
                
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    // Устанавливаем фоновое изображение
                    card.style.backgroundImage = `url('${product.image}')`;
                    
                    card.innerHTML = `
                        <div class="product-info">
                            <h2 class="product-title">${product.name}</h2>
                            <div class="product-details">
                                <span>Цвет: ${product.color}</span><br>
                                <span>Память: ${product.storage}</span>
                            </div>
                            <div class="product-price">${product.price} $</div>
                            <button class="btn-buy" onclick="alert('Товар добавлен в корзину!')">
                                Купить
                            </button>
                        </div>
                    `;
                    
                    productsContainer.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading products:', error);
                productsContainer.innerHTML = `
                    <div class="error">
                        Ошибка загрузки товаров: ${error.message}<br>
                        Проверьте, запущен ли backend на http://backend:5000
                    </div>
                `;
            }
        }
        
        // Загружаем товары при загрузке страницы
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
