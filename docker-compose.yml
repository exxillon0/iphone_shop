services:
  backend: 
   build:
    context: ./backend
   ports:
    - "5000:5000"
   depends_on:
      db:
       condition: service_healthy
   environment: 
    - DATABASE_URL=postgresql://${POSTGRE_USR}:${POSTGRE_PASSWORD}@db:5432/iphone_shop
  frontend:
   build:
    context: ./frontend
   ports:
     - "80:80"
   depends_on: 
   - backend
  db: 
   image: postgres:15-alpine
   ports:
    - "5432:5432"
   environment:
    - POSTGRES_USER=${POSTGRE_USR}
    - POSTGRES_PASSWORD=${POSTGRE_PASSWORD}
    - POSTGRES_DB=${POSTGRE_DB}
   volumes:
      - postgres_data:/var/lib/postgresql/data
   healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 10s
    timeout: 5s
    retries: 5

volumes:
  postgres_data:
